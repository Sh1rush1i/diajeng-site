<div
  data-aos="zoom-out"
  class="rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 p-10 shadow-2xl"
>
  <div class="flex flex-col justify-center items-center mt-10">
    <h2 data-aos="flip-up" class="text-3xl font-bold text-white mb-4">
      Jadinya kita <span class="text-green-300">🎮 main</span> ini ya diajeng
      <span class="text-red-300">~~</span>
    </h2>

    <div
      data-aos="zoom-out"
      class="mt-5 rounded-3xl bg-red-500/10 backdrop-blur-xl border border-white/20 p-10 shadow-2xl flex flex-col justify-center items-center"
    >
      <img
        class="w-50 h-50 object-contain mb-4"
        [src]="'/assets/' + itemForDisplay?.dataMainDiajeng?.game?.image"
        alt="{{ itemForDisplay?.dataMainDiajeng?.game?.name }}"
      />
      <p class="text-white text-lg font-bold">{{ itemForDisplay?.dataMainDiajeng?.game?.name }}</p>
      <p class="text-green-200">
        <span class="text-yellow-100"><fa-icon [icon]="['fas', 'calendar']"></fa-icon></span>
        {{ itemForDisplay?.dataMainDiajeng?.date | date: 'dd MMMM yyyy : HH:mm' }}
      </p>
    </div>
    <button
      data-aos="fade-up"
      class="mt-10 w-70 px-6 py-2 rounded-full border border-green-300 text-green-300 hover:bg-green-500 hover:text-white hover:font-bold hover:border-white/50 transition justify-between items-center hover-fancy"
      (click)="callMawl()"
    >
      Ayu main mas ~
      <span class="font-bold hover:text-red-400 ms-4"> >> _ << </span>
    </button>
  </div>
</div>

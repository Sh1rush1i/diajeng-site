<div
  data-aos="zoom-out"
  class="rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 p-10 shadow-2xl"
>
  <h2 data-aos="flip-up" class="text-3xl font-bold text-white mb-4">
    Pilih mau <span class="text-green-300">🎮 main</span> apa diajeng
    <span class="text-red-300">~~</span>
  </h2>
  @switch (isNextSequence) {
    @case (0) {
      <div class="grid grid-cols-2 gap-6 mt-5">
        <div
          class="rounded-3xl border p-10 shadow-2xl flex flex-col justify-center items-center cursor-pointer transform transition hover:scale-105"
          [ngClass]="{
            'bg-red-500/30 border-red-400': selectedItem?.game?.name === allItems[0].name,
            'bg-red-500/10 border-white/20 hover:bg-red-500/20':
              selectedItem?.game?.name !== allItems[0].name,
          }"
          (click)="selectGame(allItems[0])"
        >
          <img class="w-40 h-40 object-contain mb-4" src="assets/minecraft.webp" alt="Minecraft" />
          <p class="text-white text-lg font-bold">Minecraft</p>
        </div>

        <div
          class="rounded-3xl border p-10 shadow-2xl flex flex-col justify-center items-center cursor-pointer transform transition hover:scale-105"
          [ngClass]="{
            'bg-blue-500/30 border-blue-400': selectedItem?.game?.name === allItems[1].name,
            'bg-blue-500/10 border-white/20 hover:bg-blue-500/20':
              selectedItem?.game?.name !== allItems[1].name,
          }"
          (click)="selectGame(allItems[1])"
        >
          <img class="w-40 h-40 object-contain mb-4" src="assets/wwm.webp" alt="Where Winds Meet" />
          <p class="text-white text-lg font-bold">Where Winds Meet</p>
        </div>

        <!-- Bawah kiri -->
        <div
          class="rounded-3xl border p-10 shadow-2xl flex flex-col justify-center items-center cursor-pointer transform transition hover:scale-105"
          [ngClass]="{
            'bg-green-500/30 border-green-400': selectedItem?.game?.name === allItems[2].name,
            'bg-green-500/10 border-white/20 hover:bg-green-500/20':
              selectedItem?.game?.name !== allItems[2].name,
          }"
          (click)="selectGame(allItems[2])"
        >
          <img
            class="w-40 h-40 object-contain mb-4"
            src="assets/stardew.webp"
            alt="Stardew Valley"
          />
          <p class="text-white text-lg font-bold">Stardew Valley</p>
        </div>

        <!-- Bawah kanan -->
        <div
          class="rounded-3xl border p-10 shadow-2xl flex flex-col justify-center items-center cursor-pointer transform transition hover:scale-105"
          [ngClass]="{
            'bg-purple-500/30 border-purple-400': selectedItem?.game?.name === allItems[3].name,
            'bg-purple-500/10 border-white/20 hover:bg-purple-500/20':
              selectedItem?.game?.name !== allItems[3].name,
          }"
          (click)="selectGame(allItems[3])"
        >
          <img class="w-40 h-40 object-contain mb-4" src="assets/thesims4.webp" alt="The Sims 4" />
          <p class="text-white text-lg font-bold">The Sims 4</p>
        </div>
      </div>
    }
    @case (1) {
      <div class="flex flex-col gap-10 items-center mt-14">
        <p-floatlabel data-aos="zoom-in-down">
          <p-datepicker
            class="w-70"
            [(ngModel)]="selectedItem.date"
            inputId="over_label"
            showIcon
            [showTime]="true"
            appendTo="body"
            iconDisplay="input"
          />
          <label for="over_label">Pilih kapan mainnya</label>
        </p-floatlabel>

        <!-- <p-floatlabel data-aos="zoom-in-up">
          <p-autoComplete
            class="w-70"
            [(ngModel)]="selectedItem.game"
            [suggestions]="filteredItems"
            (completeMethod)="filterItems($event)"
            optionLabel="name"
            [dropdown]="true"
            [forceSelection]="true"
            inputId="over_label"
          >
            <ng-template let-item pTemplate="item">
              <div style="display: flex; align-items: center; gap: 10px">
                <img
                  class="w-8 h-8 rounded-full object-contain"
                  [src]="'/assets/' + item.image"
                  alt="{{ item.name }}"
                />
                <span>{{ item.name }}</span>
              </div>
            </ng-template>
          </p-autoComplete>
          <label for="over_label">Pilih game nya diajeng</label>
        </p-floatlabel> -->
      </div>
    }
  }

  <div class="flex justify-center mt-10">
    <button
      data-aos="fade-up"
      (click)="isNextSequence == 1 ? submitForm() : nextSequence()"
      class="flex px-6 py-2 rounded-full border border-blue-300 text-blue-300 hover:bg-blue-500 hover:text-white hover:border-white/50 transition justify-between items-center hover-fancy"
    >
      {{ isNextSequence == 0 ? 'Ini mas gamenya ~' : 'Main jam segini ya mas ~' }}
      <span class="font-bold hover:text-red-400 ms-8"> >> _ << </span>
    </button>
  </div>
</div>

<p-toast></p-toast>
